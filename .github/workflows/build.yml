name: Initialize Compose Multiplatform Project

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Project Name'
        required: false
        default: 'CMPApp'
      package_id:
        description: 'Package ID (e.g. com.example.cmpapp)'
        required: false
        default: 'com.example.cmpapp'

permissions:
  contents: write

jobs:
  init-cmp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download & Extract Template from JetBrains Wizard API
        run: |
          mkdir temp-cmp
          # Fetch a standard Android + iOS Compose Multiplatform template
          curl -X POST "https://kmp.jetbrains.com/api/wizard" \
            -H "Content-Type: application/json" \
            -d "{\"projectName\":\"${{ github.event.inputs.project_name }}\",\"packageId\":\"${{ github.event.inputs.package_id }}\",\"platforms\":[\"ANDROID\",\"IOS\"],\"uiFramework\":\"COMPOSE\"}" \
            --output template.zip

          unzip -q template.zip -d temp-cmp

      - name: Clear Old Files & Move CMP Project to Root
        run: |
          shopt -s dotglob
          for item in *; do
            if [[ "$item" != ".git" && "$item" != ".github" && "$item" != "temp-cmp" ]]; then
              rm -rf "$item"
            fi
          done

          # Move files from extracted nested root folder to repository root
          EXTRACTED_DIR=$(find temp-cmp -mindepth 1 -maxdepth 1 -type d)
          mv "$EXTRACTED_DIR"/* .
          rm -rf temp-cmp template.zip
          shopt -u dotglob

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: initialize Compose Multiplatform project"
            git push origin ${{ github.ref_name }}
          fi
          
