name: Initialize Fresh Expo Project

on:
  workflow_dispatch:
    inputs:
      template:
        description: 'Expo Template (e.g., blank, tabs, blank-typescript)'
        required: false
        default: 'blank'
      commit_message:
        description: 'Commit message'
        required: false
        default: 'chore: reinitialize repository with fresh Expo project'

permissions:
  contents: write

jobs:
  reinit-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create New Expo Project in Temp Folder
        run: |
          npx create-expo-app@latest temp-expo-app --template ${{ github.event.inputs.template }} --no-install

      - name: Remove Old Repository Files
        run: |
          # Enable dotglob to match hidden files (e.g., .eslintrc, .env)
          shopt -s dotglob
          
          # Delete everything in repo root except .git, .github, and temp-expo-app
          for item in *; do
            if [[ "$item" != ".git" && "$item" != ".github" && "$item" != "temp-expo-app" ]]; then
              rm -rf "$item"
            fi
          done
          
          shopt -u dotglob

      - name: Move Expo Files to Root & Generate package-lock.json
        run: |
          # Move all files (including hidden ones) from temp folder to root
          shopt -s dotglob
          mv temp-expo-app/* .
          shopt -u dotglob
          rm -rf temp-expo-app

          # Run npm install to generate/update package-lock.json
          npm install --package-lock-only

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          # Only commit and push if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "${{ github.event.inputs.commit_message }}"
            git push origin ${{ github.ref_name }}
          else
            echo "No changes to commit."
          fi
          
